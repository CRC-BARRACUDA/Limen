[package]
name = "limen-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Limen desktop GUI (egui/eframe)"
build = "build.rs"

[[bin]]
name = "Limen"
path = "main.rs"

[dependencies]
limen-core = { workspace = true }
limen-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
eframe = { workspace = true }

# Embed the app icon + version info into the .exe (Explorer / taskbar file icon).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
