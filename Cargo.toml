[workspace]
resolver = "2"
members = [
    "src/limen-proto",
    "src/limen-host",
    "src/limen-core",
    "src/limen-registry",
    "src/limen-sign",
    "src/limen-sdk-rust",
    "src/limen-ui",
    "src/limen-cli",
    "src/limen-gui",
]
# Modules are NOT part of this workspace. They're independent crates, each built
# on its own (`cargo build` in its dir) and loaded dynamically by the host from
# the executable's `modules/` directory.

[workspace.package]
version = "0.34.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
semver = "1"
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
# Signing in to the platform (limen-core/account.rs): the OS's random source for
# PKCE, query strings, and the OS keychain for the refresh token.
getrandom = "0.3"
url = "2"
keyring = "4"
# The vault (limen-core/vault.rs): Argon2id for the master password,
# XChaCha20-Poly1305 for what it keeps, and keys wiped from memory after use.
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = "1"
# Release signatures (limen-sign): OpenPGP in Rust — rPGP — so a signature is
# checked with no GnuPG on the machine. Without bzip2: signatures and keys are
# never compressed, and it is the one part that is not pure Rust.
pgp = { version = "0.21", default-features = false }
# A YubiKey's challenge-response for the vault (limen-core/security_key.rs):
# HID feature reports, in Rust on Linux and Windows — no libusb, nothing
# detached from the system.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
eframe = "0.28"
limen-proto = { path = "src/limen-proto" }
limen-host = { path = "src/limen-host" }
limen-core = { path = "src/limen-core" }
limen-registry = { path = "src/limen-registry" }
limen-sign = { path = "src/limen-sign" }
limen-sdk-rust = { path = "src/limen-sdk-rust" }
limen-ui = { path = "src/limen-ui" }

# Debug builds optimize their dependencies, not our own crates.
#
# egui rasterizes glyphs and tessellates every shape on the CPU, and unoptimized
# that is ~8ms a frame where optimized it is ~1ms — which a debug build spends on
# anything that redraws continuously (a change of UI scale, the topology map, a
# live table). Our own crates stay at opt-level 0, so breakpoints and backtraces
# are unaffected; the dependencies are compiled once and cached.
[profile.dev.package."*"]
opt-level = 2
